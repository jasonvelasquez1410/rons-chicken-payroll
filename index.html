<!DOCTYPE html>
<html lang="en" style="background-color: #080c14; color: #f8fafc; color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ron's Chicken - Custom Biometric Payroll & Timekeeping System</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff5500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ron's Payroll">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="apple-touch-icon" href="assets/logo.jpg">

  <!-- Critical Inline Styles to Prevent White Screen -->
  <style>
    html, body {
      background-color: #080c14 !important;
      color: #f8fafc !important;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Fonts (Non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet with Cache-Buster -->
  <link rel="stylesheet" href="css/style.css?v=2.3.0">

  <!-- Resilient Startup, Crash Protection & Auto Cache Clearing -->
  <script>
    // Handle URL emergency reset (?reset=1 or ?clear=1)
    if (window.location.search.indexOf('reset=1') !== -1 || window.location.search.indexOf('clear=1') !== -1) {
      try {
        if ('localStorage' in window) localStorage.clear();
        if ('sessionStorage' in window) sessionStorage.clear();
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
      } catch (e) {}
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Unregister legacy Service Workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
    }

    // Clean old caches
    if ('caches' in window) {
      caches.keys().then(function(names) {
        return Promise.all(names.map(function(name) { return caches.delete(name); }));
      }).catch(function() {});
    }

    window.__ronsAppReady = false;

    window.forceClearAndReload = function() {
      try {
        if ('localStorage' in window) localStorage.clear();
        if ('sessionStorage' in window) sessionStorage.clear();
        if ('caches' in window) {
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(name) { return caches.delete(name); }));
          }).catch(function() {});
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          }).catch(function() {});
        }
      } catch (e) {}
      window.location.href = window.location.pathname + '?reset=1&t=' + Date.now();
    };

    window.launchSafeMode = function() {
      try {
        if (window.DB && typeof window.DB.init === 'function') window.DB.init();
        if (typeof window.renderApp === 'function') {
          window.renderApp();
          return;
        }
      } catch (e) {
        console.error("Safe mode start error:", e);
      }
      window.forceClearAndReload();
    };

    // Global Crash / Script Error Protection
    window.onerror = function(msg, url, line, col, error) {
      console.error("[Ron's Payroll Startup Error]", msg, url, line, error);
      if (!window.__ronsAppReady) {
        renderRecoveryCard("Script Error: " + (msg || "Could not load application scripts"));
      }
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      console.warn("[Ron's Payroll Unhandled Rejection]", event.reason);
    });

    function renderRecoveryCard(errorDetails) {
      var card = document.getElementById('loading-fallback-card');
      if (card && !window.__ronsAppReady) {
        card.innerHTML = `
          <div style="max-width: 420px; margin: 0 auto; background: #0f172a; border: 1px solid rgba(255,85,0,0.3); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,85,0,0.15); color: #ff5500; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; font-weight: bold;">!</div>
            <h3 style="color: #ffffff; margin: 0 0 0.5rem; font-size: 1.15rem;">Ron's Chicken Payroll</h3>
            <p style="color: #94a3b8; font-size: 0.84rem; line-height: 1.5; margin: 0 0 1.25rem;">
              The system is taking longer than expected to initialize on this browser. Click below to instantly launch or reset cache.
            </p>
            <div style="display: flex; flex-direction: column; gap: 0.65rem;">
              <button onclick="window.launchSafeMode()" style="background: #ff5500; color: #ffffff; border: none; padding: 0.75rem 1rem; border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer;">
                ⚡ Launch System Now
              </button>
              <button onclick="window.forceClearAndReload()" style="background: #1e293b; color: #f8fafc; border: 1px solid #334155; padding: 0.7rem 1rem; border-radius: 10px; font-weight: 600; font-size: 0.84rem; cursor: pointer;">
                🔄 Reset Cache &amp; Fresh Reload
              </button>
            </div>
            ${errorDetails ? '<div style="margin-top: 1rem; font-size: 0.72rem; color: #64748b; word-break: break-all;">Details: ' + errorDetails + '</div>' : ''}
          </div>
        `;
      }
    }

    // Watchdog timer (triggers after 2.5s if not ready yet)
    setTimeout(function() {
      if (!window.__ronsAppReady) {
        renderRecoveryCard("Connection / Browser cache slow");
      }
    }, 2500);
  </script>
</head>
<body style="background-color: #080c14; color: #f8fafc; margin: 0; min-height: 100vh;">
  <div id="app-root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #ff5500; background: #080c14; padding: 1.5rem;">
      <div id="loading-fallback-card" style="text-align: center; width: 100%;">
        <div style="width: 50px; height: 50px; border: 4px solid #ff5500; border-top-color: transparent; border-radius: 50%; margin: 0 auto 1.25rem; animation: spin 0.9s linear infinite;"></div>
        <div style="font-weight: 800; font-size: 1.15rem; color: #ffffff; letter-spacing: -0.02em;">RON'S CHICKEN PAYROLL</div>
        <div style="font-size: 0.82rem; color: #94a3b8; margin-top: 0.4rem;">Loading Cugman Biometric Attendance &amp; Staff Records...</div>
      </div>
    </div>
  </div>

  <!-- Application Scripts with Cache-Busters -->
  <script src="js/db.js?v=2.3.0"></script>
  <script src="js/biometric-parser.js?v=2.3.0"></script>
  <script src="js/payroll-engine.js?v=2.3.0"></script>
  <script src="js/device-sync.js?v=2.3.0"></script>
  <script src="js/firebase-sync.js?v=2.3.0"></script>
  <script src="js/app.js?v=2.3.0"></script>
</body>
</html>
